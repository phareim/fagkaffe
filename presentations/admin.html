<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poll Admin — Miles Fagkaffe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --miles-red: #ff303b;
      --burgundy: #450d20;
      --cream: #fbf0e5;
      --yellow: #ffd9a1;
      --dark-teal: #004047;
      --teal: #78e8db;
      --bg: #1a1a1a;
      --surface: #242424;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--dark-teal);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--cream);
    }
    header .badge {
      background: var(--miles-red);
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--teal);
      margin-bottom: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .card .meta {
      font-size: 0.8rem;
      opacity: 0.55;
      font-family: 'DM Mono', monospace;
    }
    .card .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .btn {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--miles-red); color: white; }
    .btn-teal { background: var(--teal); color: var(--dark-teal); }
    .btn-outline {
      background: transparent;
      color: var(--cream);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: rgba(255,255,255,0.3); opacity: 1; }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.open { background: #4ade80; }
    .status-dot.closed { background: #6b7280; }
    input, select, textarea {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--cream);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 0.9rem;
      padding: 10px 14px;
      width: 100%;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--teal);
    }
    select option { background: #1a1a1a; }
    label {
      display: block;
      font-size: 0.8rem;
      opacity: 0.6;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .form-row { margin-bottom: 12px; }
    .poll-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      margin-top: 10px;
    }
    .poll-card h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
    .results-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
    .results-bar .label { font-size: 0.85rem; min-width: 60px; }
    .bar-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 4px;
      transition: width 0.5s;
    }
    .bar-count { font-size: 0.8rem; opacity: 0.6; min-width: 28px; text-align: right; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    #auth-screen h2 { font-size: 1.4rem; margin-bottom: 8px; }
    #auth-screen p { opacity: 0.6; margin-bottom: 24px; font-size: 0.9rem; }
    #auth-screen input { max-width: 360px; text-align: center; letter-spacing: 0.05em; }
    #main-screen { display: none; }
    .empty { opacity: 0.5; font-size: 0.9rem; margin: 12px 0; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--dark-teal);
      border: 1px solid var(--teal);
      color: var(--cream);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: none; }
  </style>
</head>
<body>

<header>
  <h1>Poll Admin</h1>
  <span class="badge">Miles Fagkaffe</span>
</header>

<div id="auth-screen">
  <h2>Admin-innlogging</h2>
  <p>Skriv inn admin-tokenet for å fortsette.</p>
  <input type="password" id="token-input" placeholder="Admin token" autocomplete="current-password" />
  <br>
  <button class="btn btn-primary" id="auth-btn" style="margin-top:4px">Logg inn</button>
</div>

<div id="main-screen">
  <div class="main">
    <!-- Presentation selector + new session -->
    <div class="card">
      <p class="section-title">Presentasjon</p>
      <div class="form-row">
        <label for="pres-select">Velg presentasjon</label>
        <select id="pres-select">
          <option value="ai-agile">ai-agile</option>
          <option value="test">test</option>
        </select>
      </div>
      <div class="form-row">
        <label for="session-label">Sesjonsnavn (valgfritt)</label>
        <input type="text" id="session-label" placeholder="f.eks. Haugesund feb 2026" />
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="create-session-btn">Opprett ny sesjon</button>
        <button class="btn btn-outline" id="refresh-btn">Oppdater</button>
      </div>
    </div>

    <hr class="divider">

    <!-- Sessions list -->
    <p class="section-title">Sesjoner</p>
    <div id="sessions-list"><p class="empty">Laster...</p></div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const BASE = '';
  let token = sessionStorage.getItem('admin_token') || '';
  let pollRefreshTimers = {};

  // ── Auth ────────────────────────────────────────

  function showMain() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    loadSessions();
  }

  document.getElementById('auth-btn').addEventListener('click', () => {
    token = document.getElementById('token-input').value.trim();
    if (!token) return;
    sessionStorage.setItem('admin_token', token);
    showMain();
  });

  document.getElementById('token-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('auth-btn').click();
  });

  if (token) showMain();

  // ── API helpers ──────────────────────────────────

  async function api(method, path, body) {
    const opts = {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(BASE + path, opts);
    if (res.status === 401) {
      sessionStorage.removeItem('admin_token');
      location.reload();
    }
    return res.json();
  }

  // ── Toast ─────────────────────────────────────────

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ── Sessions ──────────────────────────────────────

  async function loadSessions() {
    const pres = document.getElementById('pres-select').value;
    const list = document.getElementById('sessions-list');
    list.innerHTML = '<p class="empty">Laster...</p>';

    let sessions;
    try {
      sessions = await api('GET', `/api/admin/sessions?presentation=${encodeURIComponent(pres)}`);
    } catch {
      list.innerHTML = '<p class="empty">Feil ved lasting.</p>';
      return;
    }

    if (!Array.isArray(sessions) || sessions.length === 0) {
      list.innerHTML = '<p class="empty">Ingen sesjoner ennå.</p>';
      return;
    }

    list.innerHTML = '';
    for (const s of sessions) {
      list.appendChild(renderSession(s));
    }
  }

  function renderSession(s) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.sessionId = s.id;

    const date = new Date(s.created_at).toLocaleString('no-NO');
    card.innerHTML = `
      <h3>
        <span class="status-dot ${s.status}"></span>
        ${escHtml(s.label || s.id)}
      </h3>
      <p class="meta">${escHtml(s.id)} — ${date} — ${s.poll_count || 0} avstemning(er), ${s.vote_count || 0} stemme(r)</p>
      <div class="actions session-actions">
        <button class="btn btn-outline toggle-session-btn" data-status="${s.status}">
          ${s.status === 'open' ? 'Lukk sesjon' : 'Åpne sesjon'}
        </button>
      </div>
      <div class="polls-container"></div>
    `;

    card.querySelector('.toggle-session-btn').addEventListener('click', async () => {
      const newStatus = s.status === 'open' ? 'closed' : 'open';
      await api('PATCH', `/api/admin/sessions/${s.id}`, { status: newStatus });
      toast(newStatus === 'open' ? 'Sesjon åpnet' : 'Sesjon lukket');
      loadSessions();
    });

    loadPolls(s.id, card.querySelector('.polls-container'));
    return card;
  }

  async function loadPolls(sessionId, container) {
    // Clear any existing refresh timer for this session
    if (pollRefreshTimers[sessionId]) clearInterval(pollRefreshTimers[sessionId]);

    async function refresh() {
      let polls;
      try {
        const data = await api('GET', `/api/admin/sessions?presentation=${encodeURIComponent(document.getElementById('pres-select').value)}`);
        if (!Array.isArray(data)) return;
        const session = data.find(s => s.id === sessionId);
        if (!session) return;
        // We need poll data from a different endpoint — load active session for the same presentation
        // Actually let's fetch results per poll. First fetch polls via the active endpoint (or we can use admin endpoint)
        // Since admin sessions endpoint doesn't return polls, we call GET /api/sessions/active
        // But the session might be closed. Let's render from the active endpoint for open sessions,
        // and show static data otherwise.
      } catch {}
    }

    // Fetch polls from active endpoint for now (works if session is open)
    // For a more complete solution, all polls would be fetchable from an admin polls endpoint.
    // Here we use the sessions/active endpoint and supplement with results.
    await renderPolls(sessionId, container);
    pollRefreshTimers[sessionId] = setInterval(() => renderPolls(sessionId, container), 5000);
  }

  async function renderPolls(sessionId, container) {
    const pres = document.getElementById('pres-select').value;
    let data;
    try {
      // Fetch active session data which includes polls
      const res = await fetch(`${BASE}/api/sessions/active?presentation=${encodeURIComponent(pres)}`);
      data = await res.json();
    } catch {
      return;
    }

    // Only show polls if this is the active session
    if (!data.session || data.session.id !== sessionId) {
      if (container.innerHTML === '') {
        container.innerHTML = '<p class="empty" style="margin-top:12px">Ingen avstemninger (sesjon ikke aktiv).</p>';
      }
      return;
    }

    if (!data.polls || data.polls.length === 0) {
      container.innerHTML = '<p class="empty" style="margin-top:12px">Ingen avstemninger ennå.</p>';
      return;
    }

    // Fetch results for each poll
    const pollsWithResults = await Promise.all(data.polls.map(async (poll) => {
      try {
        const res = await fetch(`${BASE}/api/results?poll_id=${poll.id}`);
        const results = await res.json();
        return { ...poll, results };
      } catch {
        return poll;
      }
    }));

    container.innerHTML = pollsWithResults.map(poll => {
      const options = JSON.parse(poll.options);
      const results = poll.results || {};
      const total = results.total || 0;
      const breakdown = results.breakdown || {};

      const bars = options.map(opt => {
        const count = breakdown[opt] || 0;
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        return `
          <div class="results-bar">
            <span class="label">${escHtml(opt)}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="bar-count">${count}</span>
          </div>`;
      }).join('');

      return `
        <div class="poll-card">
          <h4>${escHtml(poll.question)}</h4>
          <p class="meta">
            <span class="status-dot ${poll.status}" style="margin-left:0"></span>
            ${poll.status} — ${total} stemme(r)
          </p>
          ${bars}
          <div class="actions" style="margin-top:10px">
            <button class="btn btn-outline" onclick="togglePoll('${poll.id}','${poll.status}')">
              ${poll.status === 'open' ? 'Lukk avstemning' : 'Åpne avstemning'}
            </button>
          </div>
        </div>`;
    }).join('');
  }

  // Expose togglePoll globally since it's used in onclick
  window.togglePoll = async function(pollId, currentStatus) {
    const newStatus = currentStatus === 'open' ? 'closed' : 'open';
    await api('PATCH', `/api/admin/polls/${pollId}`, { status: newStatus });
    toast(newStatus === 'open' ? 'Avstemning åpnet' : 'Avstemning lukket');
    loadSessions();
  };

  // ── Controls ──────────────────────────────────────

  document.getElementById('create-session-btn').addEventListener('click', async () => {
    const pres = document.getElementById('pres-select').value;
    const label = document.getElementById('session-label').value.trim();
    if (!pres) return;
    await api('POST', '/api/admin/sessions', { presentation: pres, label: label || undefined });
    toast('Ny sesjon opprettet!');
    document.getElementById('session-label').value = '';
    loadSessions();
  });

  document.getElementById('refresh-btn').addEventListener('click', loadSessions);
  document.getElementById('pres-select').addEventListener('change', loadSessions);

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>
</body>
</html>
