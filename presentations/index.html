<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations — Miles</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Gelica';
      src: url('public/fonts/Gelica/Gelica-Medium.ttf') format('truetype');
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gelica';
      src: url('public/fonts/Gelica/Gelica-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-display: swap;
    }

    :root {
      --miles-red: #ff303b;
      --burgundy: #450d20;
      --cream: #fbf0e5;
      --dark-teal: #004047;
      --teal: #78e8db;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--cream);
      color: var(--burgundy);
      min-height: 100vh;
    }

    header {
      background: var(--burgundy);
      padding: 3rem 2rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    header h1 {
      font-family: 'Gelica', Georgia, serif;
      font-weight: 500;
      color: var(--cream);
      font-size: 2.2rem;
    }

    header img {
      height: 2.5rem;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 1.8rem;
      text-decoration: none;
      color: var(--burgundy);
      box-shadow: 0 1px 3px rgba(69, 13, 32, 0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border: 1px solid rgba(69, 13, 32, 0.06);
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(69, 13, 32, 0.12);
    }

    .card-title {
      font-family: 'Gelica', Georgia, serif;
      font-weight: 600;
      font-size: 1.25rem;
      line-height: 1.3;
    }

    .card-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .empty {
      text-align: center;
      padding: 4rem 1rem;
      opacity: 0.5;
      font-size: 1.1rem;
    }

    .deploy-stamp {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
      font-size: 0.8rem;
      opacity: 0.4;
    }

    .deploy-stamp a {
      color: var(--burgundy);
      font-family: 'DM Mono', monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>Presentations</h1>
    <img src="public/miles-logo-red.svg" alt="Miles">
  </header>
  <main>
    <div class="grid">
      <a class="card" href="ai-agile-drafts-2">
        <div class="card-title">DRAFTS: AI & Agile 2</div>
        <div class="card-meta"><span>Mars 2026</span><span>9 slides</span></div>
      </a>
      <a class="card" href="ai-agile-drafts">
        <div class="card-title">DRAFT: AI &amp; Agile</div>
        <div class="card-meta"><span>27 slides</span></div>
      </a>
      <a class="card" href="ai-agile">
        <div class="card-title">AI & Agile</div>
        <div class="card-meta"><span>2026</span><span>28 slides</span></div>
      </a>
      <a class="card" href="ai-tooling-2026">
        <div class="card-title">AI Tooling 2026</div>
        <div class="card-meta"><span>Februar 2026</span><span>26 slides</span></div>
      </a>
      <a class="card" href="salme-ved-reisens-slutt">
        <div class="card-title">Salme ved reisens slutt</div>
        <div class="card-meta"><span>2026</span><span>10 slides</span></div>
      </a>
    </div>
    <p class="deploy-stamp">
      Deployed 2026-03-19 15:35 from <a href="https://github.com/phareim/fagkaffe/commit/a9d4a86d75425dda98160479a8aff029a8efa3d1">a9d4a86</a>
    </p>
  </main>
</body>
</html>
